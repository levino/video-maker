<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 320px; height: 180px; overflow: hidden; }
  div { position: absolute; }
  #bar { left: 0; top: 0; height: 20px; background: #00ff00; }
  #timer { left: 0; bottom: 0; width: 40px; height: 40px; background: #000000; }
  #css { right: 0; bottom: 0; width: 40px; height: 40px; animation: swap 1s step-end both; }
  @keyframes swap { 0% { background: #ffff00; } 50% { background: #ff00ff; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="timer"></div>
<div id="css"></div>
<script type="module">
  import { defineVideo } from '/__video-maker/kit/index.js'

  // Driven by requestAnimationFrame and performance.now: 100 px per second
  const bar = document.getElementById('bar')
  const loop = () => {
    bar.style.width = Math.round(performance.now() / 10) + 'px'
    bar.dataset.date = String(Date.now())
    requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop)

  // Driven by a timer: white from 0.3 s on
  setTimeout(() => (document.getElementById('timer').style.background = '#ffffff'), 300)

  defineVideo({
    width: 320,
    height: 180,
    fps: 10,
    duration: 1,
    frame(n) {
      document.body.style.background = n < 5 ? '#ff0000' : '#0000ff'
    },
  })
</script>
</body>
</html>
